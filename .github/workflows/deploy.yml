name: Deploy to Server

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:  # 允许手动触发

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: 检出代码
      uses: actions/checkout@v3

    - name: 设置 Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20'
        cache: 'npm'

    - name: 安装依赖并构建
      run: |
        npm install
        npm run build

    - name: 部署到服务器
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.SERVER_IP }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          mkdir -p /var/www/portfolio/{frontend,server,uploads,logs}

    - name: 上传前端文件
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.SERVER_IP }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        source: "dist/*"
        target: ${{ secrets.REMOTE_DIR }}/frontend/
        strip_components: 1
        rm: true

    - name: 上传后端文件
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.SERVER_IP }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        source: "server/index.js,server/package.json"
        target: ${{ secrets.REMOTE_DIR }}/server/
        strip_components: 1

    - name: 重启服务
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.SERVER_IP }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          cd /var/www/portfolio/server
          npm install --production

          # 更新 Nginx 配置
          cat > /etc/nginx/conf.d/portfolio.conf << 'EOFNGINX'
          server {
              listen 80;
              server_name _;
              root /var/www/portfolio/frontend;
              index index.html;

              location /uploads/ {
                  alias /var/www/portfolio/uploads/;
                  expires 30d;
                  add_header Cache-Control "public, immutable";
              }

              location /api/ {
                  proxy_pass http://127.0.0.1:3000;
                  proxy_http_version 1.1;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  client_max_body_size 15m;
              }

              location / {
                  try_files $uri $uri/ /index.html;
              }
          }
          EOFNGINX

          # 重载 Nginx
          nginx -t && systemctl reload nginx || true

          # 重启 PM2
          export UPLOADS_DIR=/var/www/portfolio/uploads
          pm2 delete portfolio 2>/dev/null || true
          cd /var/www/portfolio/server
          UPLOADS_DIR=/var/www/portfolio/uploads pm2 start index.js --name portfolio --update-env
          pm2 save

          echo "✓ 部署完成"
